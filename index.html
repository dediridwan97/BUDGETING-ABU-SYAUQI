  <style>
    /* Isolasi penuh dan fondasi Mobile-Only Shell */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      width: 100% !important;
      height: 100% !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      background-color: #f1f5f9 !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* Kontainer Full-Page Terpusat */
    #abu-syauqi-app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 12% 10%, rgba(16, 185, 129, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 88% 85%, rgba(15, 118, 110, 0.14) 0%, transparent 48%),
        linear-gradient(135deg, #f8fafc 0%, #ecfdf5 50%, #f1f5f9 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0f172a;
      box-sizing: border-box;
      overflow: hidden;
    }

    #abu-syauqi-app *, #abu-syauqi-app *::before, #abu-syauqi-app *::after {
      box-sizing: border-box;
    }

    /* Bingkai Aplikasi HP (Mobile-Only Shell max 440px) */
    #mobile-shell {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100%;
      margin: 0 auto;
      background:
        radial-gradient(circle at 85% 6%, rgba(16, 185, 129, 0.09) 0%, transparent 38%),
        radial-gradient(circle at 10% 42%, rgba(15, 118, 110, 0.06) 0%, transparent 40%),
        #f8fafc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 65px -15px rgba(15, 23, 42, 0.18);
    }

    /* Efek Kartu Glassmorphism Bersih */
    .glass-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 24px -6px rgba(15, 23, 42, 0.06);
    }

    .glass-bar {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Scrollbar halus */
    .app-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .app-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .app-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    /* Animasi Bottom Sheet & Fade */
    @keyframes slideUpSheet {
      from { transform: translateY(100%); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-sheet {
      animation: slideUpSheet 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade {
      animation: fadeIn 0.18s ease-out forwards;
    }

    /* Mode Cetak / Simpan PDF */
    @media print {
      #abu-syauqi-app {
        position: static !important;
        height: auto !important;
        width: 100% !important;
        background: #ffffff !important;
        display: block !important;
      }
      #mobile-shell {
        max-width: 100% !important;

      }
      #app-main-scroll {
        overflow: visible !important;
        height: auto !important;
        padding-bottom: 0 !important;
      }
    }
  </style>

  <!-- ===================================================================== -->
  <!-- JAVASCRIPT MODULAR SUPABASE + INSTANT 0-SECOND CACHE & OPTIMISTIC UI  -->
  <!-- ===================================================================== -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // =========================================================================
    // 1. SAKLAR MODE PREVIEW VS PRODUKSI SUPABASE (WAJIB)
    // =========================================================================
    const IS_PREVIEW = false; // Ubah menjadi false saat deploy ke Vercel agar 100% terhubung ke Supabase
    const SUPABASE_URL = "https://dgvzlyldwbfhqrtazuyz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_qPinniRZpOp4oJEZLb1T3g_vE7fkjMa";

    // Inisialisasi klien Supabase hanya saat mode produksi & kredensial valid
    let supabase = null;
    if (!IS_PREVIEW && SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("YOUR_PROJECT_ID")) {
      supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false }
      });
    }

    // =========================================================================
    // 2. KONSTANTA, STATE & CHART REGISTRY
    // =========================================================================
    const PREVIEW_STORAGE_KEY = "abu_syauqi_preview_db_v1";
    const SUPABASE_CACHE_KEY = "abu_syauqi_supabase_cache_v1";
    const PWA_DISMISS_KEY = "abu_syauqi_pwa_dismissed";

    const BULAN_LIST = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    const nowDate = new Date();
    const state = {
      activePage: "dashboard", // dashboard | transaksi | anggaran | lainnya | dompet | tabungan | tagihan | laporan | pengaturan
      selectedMonth: nowDate.getMonth(),
      selectedYear: nowDate.getFullYear(),
      dashExTab: "top21",         // top21 | alokasi | compare
      dashInTab: "top10",         // top10 | kategori | compare
      dashBudgetTab: "Kebutuhan", // Kebutuhan | Keinginan | Investasi
      txSearch: "",
      txJenis: "ALL",
      txDompet: "ALL",
      katTab: "Pengeluaran",      // Pengeluaran | Pemasukan
      katSearch: "",
      katCollapsed: {},
      syncStatus: IS_PREVIEW ? "preview" : "idle", // preview | syncing | synced | offline
      data: {
        dompet: [],
        kategori: [],
        transaksi: [],
        targetBulanan: [],
        targetTabungan: [],
        tagihan: []
      }
    };

    const chartInstances = {};
    function destroyChart(key) {
      if (chartInstances[key]) {
        chartInstances[key].destroy();
        delete chartInstances[key];
      }
    }
    function destroyAllCharts() {
      Object.keys(chartInstances).forEach(destroyChart);
    }

    // =========================================================================
    // 3. HELPER FORMAT, UTILITAS & UI (TOAST, BOTTOM SHEET, CONFIRM)
    // =========================================================================
    function formatRp(num) {
      const n = Number(num) || 0;
      const absStr = Math.round(Math.abs(n)).toLocaleString("id-ID");
      return (n < 0 ? "-Rp " : "Rp ") + absStr;
    }

    function formatShortRp(num) {
      const n = Number(num) || 0;
      const sign = n < 0 ? "-" : "";
      const abs = Math.abs(n);
      if (abs >= 1000000000) return sign + (abs / 1000000000).toFixed(1) + "M";
      if (abs >= 1000000) return sign + (abs / 1000000).toFixed(1) + "jt";
      if (abs >= 1000) return sign + Math.round(abs / 1000) + "rb";
      return sign + Math.round(abs);
    }

    function formatNumberComma(val) {
      if (val === "" || val === null || val === undefined) return "";
      const digits = String(val).replace(/[^\d]/g, "");
      if (!digits) return "";
      return Number(digits).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function parseNominal(val) {
      const digits = String(val == null ? "" : val).replace(/[^\d]/g, "");
      return digits ? Number(digits) : 0;
    }

    function formatNominalInput(el) {
      const start = el.selectionStart || 0;
      const oldLen = el.value.length;
      const formatted = formatNumberComma(el.value);
      el.value = formatted;
      const newLen = formatted.length;
      const nextPos = Math.max(0, start + (newLen - oldLen));
      try { el.setSelectionRange(nextPos, nextPos); } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function getBulanTahunKey(year, monthIdx) {
      return year + "-" + pad2(monthIdx + 1);
    }

    function getPrevMonthYear(year, monthIdx) {
      if (monthIdx === 0) return { year: year - 1, month: 11 };
      return { year: year, month: monthIdx - 1 };
    }

    function formatDateIndo(iso) {
      if (!iso) return "-";
      const p = String(iso).slice(0, 10).split("-");
      if (p.length !== 3) return iso;
      const m = Number(p[1]) - 1;
      return Number(p[2]) + " " + (BULAN_LIST[m] ? BULAN_LIST[m].slice(0, 3) : p[1]) + " " + p[0];
    }

    function genId(prefix) {
      return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
    }

    function cloneStateData() {
      return JSON.parse(JSON.stringify(state.data));
    }

    function getPosBadgeClass(pos) {
      if (pos === "Kebutuhan") return "bg-rose-100/90 text-rose-700 border-rose-200";
      if (pos === "Keinginan") return "bg-amber-100/90 text-amber-800 border-amber-200";
      if (pos === "Investasi") return "bg-teal-100/90 text-teal-800 border-teal-200";
      return "bg-slate-100 text-slate-600 border-slate-200";
    }

    function setSyncStatus(status) {
      state.syncStatus = IS_PREVIEW ? "preview" : status;
      const icon = document.getElementById("btn-refresh-icon");
      if (icon) icon.classList.toggle("animate-spin", state.syncStatus === "syncing");
      renderSyncIndicator();
    }

    function renderSyncIndicator() {
      const el = document.getElementById("sync-status-indicator");
      if (!el) return;
      if (IS_PREVIEW) {
        el.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-500 inline-block"></span><span class="text-amber-700">Mode Preview (Lokal)</span>';
      } else if (state.syncStatus === "syncing") {
        el.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-teal-500 animate-ping inline-block"></span><span class="text-teal-700">Menyinkronkan...</span>';
      } else if (state.syncStatus === "offline") {
        el.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-rose-500 inline-block"></span><span class="text-rose-600">Offline • Cache Lokal</span>';
      } else {
        el.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span><span class="text-emerald-700">Tersinkronisasi • Supabase</span>';
      }
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const colors = {
        success: "bg-emerald-700 text-white",
        error: "bg-rose-600 text-white",
        warning: "bg-amber-500 text-white",
        info: "bg-slate-800 text-white"
      };
      const icons = {
        success: "fa-circle-check",
        error: "fa-circle-xmark",
        warning: "fa-triangle-exclamation",
        info: "fa-circle-info"
      };
      const el = document.createElement("div");
      el.className = "pointer-events-auto flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl shadow-lg text-xs font-bold animate-fade " + (colors[type] || colors.info);
      el.innerHTML = '<i class="fa-solid ' + (icons[type] || icons.info) + ' text-sm shrink-0"></i><span class="leading-snug">' + escapeHtml(message) + '</span>';
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transition = "opacity 0.25s ease";
        setTimeout(() => el.remove(), 250);
      }, 2600);
    }

    function openSheet(title, htmlContent) {
      document.getElementById("sheet-title").textContent = title;
      document.getElementById("sheet-body").innerHTML = htmlContent;
      document.getElementById("sheet-backdrop").classList.remove("hidden");
    }

    function closeSheet() {
      document.getElementById("sheet-backdrop").classList.add("hidden");
      document.getElementById("sheet-body").innerHTML = "";
    }

    function showConfirm(title, message, onConfirm) {
      const backdrop = document.getElementById("confirm-backdrop");
      document.getElementById("confirm-title").textContent = title;
      document.getElementById("confirm-message").textContent = message;
      backdrop.classList.remove("hidden");
      const okBtn = document.getElementById("confirm-ok-btn");
      const cancelBtn = document.getElementById("confirm-cancel-btn");
      const cleanup = () => {
        backdrop.classList.add("hidden");
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };
      cancelBtn.onclick = cleanup;
      okBtn.onclick = () => {
        cleanup();
        if (typeof onConfirm === "function") onConfirm();
      };
    }

    // =========================================================================
    // 4. MASTER 79 KATEGORI & DATA DUMMY MINIMALIS (HANYA UNTUK IS_PREVIEW=true)
    // =========================================================================
    function getDefaultMasterKategori() {
      const pengeluaranRaw = [
        // Kebutuhan Rumah Tangga (12)
        ["Kebutuhan Rumah Tangga", "Belanja bulanan", "Kebutuhan"],
        ["Kebutuhan Rumah Tangga", "Listrik", "Kebutuhan"],
        ["Kebutuhan Rumah Tangga", "Air", "Kebutuhan"],
        ["Kebutuhan Rumah Tangga", "Gas (LPG)", "Kebutuhan"],

    // =========================================================================
    // 5. LAYER CACHE (0 DETIK) & SINKRONISASI SUPABASE (OPTIMISTIC UI)
    // =========================================================================
    function saveLocalState() {
      try {
        const key = IS_PREVIEW ? PREVIEW_STORAGE_KEY : SUPABASE_CACHE_KEY;
        localStorage.setItem(key, JSON.stringify(state.data));
      } catch (e) {}
    }

    function loadLocalCache() {
      try {
        const key = IS_PREVIEW ? PREVIEW_STORAGE_KEY : SUPABASE_CACHE_KEY;
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return parsed;
      } catch (e) {}
      return null;
    }

    function applyDataToState(rawData) {
      state.data = {
        dompet: Array.isArray(rawData.dompet) ? rawData.dompet : [],
        kategori: Array.isArray(rawData.kategori) ? rawData.kategori : [],
        transaksi: Array.isArray(rawData.transaksi) ? rawData.transaksi : [],
        targetBulanan: Array.isArray(rawData.targetBulanan) ? rawData.targetBulanan : [],
        targetTabungan: Array.isArray(rawData.targetTabungan) ? rawData.targetTabungan : [],
        tagihan: Array.isArray(rawData.tagihan) ? rawData.tagihan : []
      };
      saveLocalState();
      renderCurrentPage();
    }

    // Sinkronisasi paralel 6 tabel Supabase di latar belakang (non-blocking)
    async function syncFromSupabase(silent = true) {
      if (IS_PREVIEW) {
        if (!silent) showToast("Data Preview lokal aktif", "info");
        return;
      }
      if (!supabase) {
        setSyncStatus("offline");
        if (!silent) showToast("Isi SUPABASE_URL & SUPABASE_ANON_KEY terlebih dahulu", "warning");
        return;
      }

      setSyncStatus("syncing");
      try {
        const [
          resDompet,
          resKategori,
          resTransaksi,
          resTargetBulanan,
          resTargetTabungan,
          resTagihan
        ] = await Promise.all([
          supabase.from("dompet").select("*").order("nama_dompet", { ascending: true }),
          supabase.from("kategori").select("*").order("id", { ascending: true }),
          supabase.from("transaksi").select("*").order("tanggal", { ascending: false }).order("created_at", { ascending: false }),
          supabase.from("target_bulanan").select("*"),
          supabase.from("target_tabungan").select("*").order("tenggat_waktu", { ascending: true }),
          supabase.from("tagihan").select("*").order("jatuh_tempo", { ascending: true })
        ]);

        const firstErr = resDompet.error || resKategori.error || resTransaksi.error || resTargetBulanan.error || resTargetTabungan.error || resTagihan.error;
        if (firstErr) throw firstErr;

        applyDataToState({
          dompet: resDompet.data || [],
          kategori: resKategori.data || [],
          transaksi: resTransaksi.data || [],
          targetBulanan: resTargetBulanan.data || [],
          targetTabungan: resTargetTabungan.data || [],
          tagihan: resTagihan.data || []
        });

        setSyncStatus("synced");
        if (!silent) showToast("Tersinkronisasi dengan Supabase", "success");
      } catch (err) {
        console.error("Supabase sync error:", err);
        setSyncStatus("offline");
        if (!silent) showToast("Gagal sinkron: " + (err.message || "Periksa koneksi"), "error");
      }
    }

    // Wrapper Optimistic UI: ubah UI 0 detik -> eksekusi Supabase async -> rollback jika error
    async function runOptimisticMutation(mutateLocalFn, supabaseTaskFn, successMsg) {
      const prevSnapshot = cloneStateData();
      try {
        mutateLocalFn();
        saveLocalState();
        renderCurrentPage();
        if (successMsg) showToast(successMsg, "success");
      } catch (localErr) {
        state.data = prevSnapshot;
        renderCurrentPage();
        showToast("Gagal memproses data lokal", "error");
        return false;
      }

      if (IS_PREVIEW) return true;
      if (!supabase) {
        state.data = prevSnapshot;
        saveLocalState();
        renderCurrentPage();
        showToast("Konfigurasi Supabase belum diisi", "error");
        return false;
      }

      setSyncStatus("syncing");
      try {
        const result = await supabaseTaskFn();
        if (result && result.error) throw result.error;
        setSyncStatus("synced");
        return true;
      } catch (err) {
        console.error("Supabase mutation error (rollback):", err);
        state.data = prevSnapshot;
        saveLocalState();
        renderCurrentPage();
        setSyncStatus("offline");
        showToast("Gagal simpan ke Supabase (dibatalkan): " + (err.message || "Cek koneksi/RLS"), "error");
        return false;
      }
    }

    function manualRefresh() {
      syncFromSupabase(false);
    }

    // 6. KALKULASI KEUANGAN & ANALITIK DASHBOARD
    // =========================================================================
    function getTransactionsByPeriod(year, monthIdx) {
      const prefix = getBulanTahunKey(year, monthIdx);
      return state.data.transaksi.filter((tx) => String(tx.tanggal || "").startsWith(prefix));
    }

    function getTargetBulanan(year, monthIdx) {
      const key = getBulanTahunKey(year, monthIdx);
      return state.data.targetBulanan.find((t) => t.bulan_tahun === key) || null;
    }

    function getWalletName(id) {
      const w = state.data.dompet.find((x) => x.id === id);
      return w ? w.nama_dompet : "-";
    }

    function getWalletBalance(id) {
      const w = state.data.dompet.find((x) => x.id === id);
      let bal = w ? (Number(w.saldo_awal) || 0) : 0;
      state.data.transaksi.forEach((tx) => {
        const nom = Number(tx.nominal) || 0;
        if (tx.jenis === "Pemasukan" && tx.id_dompet === id) bal += nom;
        if (tx.jenis === "Pengeluaran" && tx.id_dompet === id) bal -= nom;
        if (tx.jenis === "Transfer") {
          if (tx.id_dompet === id) bal -= nom;
          if (tx.id_dompet_tujuan === id) bal += nom;
        }
      });
      return bal;
    }

    function computeMonthMetrics(year, monthIdx) {
      const list = getTransactionsByPeriod(year, monthIdx);
      let income = 0, expense = 0, inCount = 0, exCount = 0;
      const exBySub = {};
      const exByMain = {};
      const inBySub = {};
      const inByMain = {};
      const posMap = { Kebutuhan: {}, Keinginan: {}, Investasi: {} };
      const posTotal = { Kebutuhan: 0, Keinginan: 0, Investasi: 0 };

      const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
      const dailyExpense = new Array(daysInMonth).fill(0);

      list.forEach((tx) => {
        const nom = Number(tx.nominal) || 0;
        if (tx.jenis === "Pemasukan") {
          income += nom;
          inCount++;
          inBySub[tx.sub_kategori] = (inBySub[tx.sub_kategori] || 0) + nom;
          inByMain[tx.kategori_utama] = (inByMain[tx.kategori_utama] || 0) + nom;
        } else if (tx.jenis === "Pengeluaran") {
          expense += nom;
          exCount++;
          exBySub[tx.sub_kategori] = (exBySub[tx.sub_kategori] || 0) + nom;
          exByMain[tx.kategori_utama] = (exByMain[tx.kategori_utama] || 0) + nom;
          const pos = (tx.pos_budget === "Kebutuhan" || tx.pos_budget === "Keinginan" || tx.pos_budget === "Investasi")
            ? tx.pos_budget
            : "Kebutuhan";
          posMap[pos][tx.sub_kategori] = (posMap[pos][tx.sub_kategori] || 0) + nom;
          posTotal[pos] += nom;

          const dayNum = Number(String(tx.tanggal).slice(0, 10).split("-")[2]);
          if (dayNum >= 1 && dayNum <= daysInMonth) {
            dailyExpense[dayNum - 1] += nom;
          }
        }
      });

      const sortObj = (obj) => Object.entries(obj)
        .map((e) => ({ name: e[0], total: e[1] }))
        .sort((a, b) => b.total - a.total);

      return {
        list,
        income,
        expense,
        saldo: income - expense,
        totalTx: list.length,
        inCount,
        exCount,
        topExSub: sortObj(exBySub),
        topExMain: sortObj(exByMain),
        topInSub: sortObj(inBySub),
        topInMain: sortObj(inByMain),
        exBySubMap: exBySub,
        inBySubMap: inBySub,
        posList: {
          Kebutuhan: sortObj(posMap.Kebutuhan),
          Keinginan: sortObj(posMap.Keinginan),
          Investasi: sortObj(posMap.Investasi)
        },
        posTotal,
        dailyExpense,
        daysInMonth
      };
    }

    function pctChangeText(curr, prev) {
      if (prev === 0 && curr === 0) return "0% vs bln lalu";
      if (prev === 0) return "+100% vs bln lalu";
      const diff = ((curr - prev) / Math.abs(prev)) * 100;
      const sign = diff > 0 ? "+" : "";
      return sign + diff.toFixed(1) + "% vs bln lalu";
    }

    function renderDashboardPage(container) {
      const cur = computeMonthMetrics(state.selectedYear, state.selectedMonth);
      const prevInfo = getPrevMonthYear(state.selectedYear, state.selectedMonth);
      const prev = computeMonthMetrics(prevInfo.year, prevInfo.month);
      const targetObj = getTargetBulanan(state.selectedYear, state.selectedMonth);
      const targetNom = targetObj ? (Number(targetObj.target_pengeluaran) || 0) : 0;
      const pKeb = targetObj ? (Number(targetObj.persen_kebutuhan) || 50) : 50;
      const pKei = targetObj ? (Number(targetObj.persen_keinginan) || 30) : 30;
      const pInv = targetObj ? (Number(targetObj.persen_investasi) || 20) : 20;

      const totalFlow = cur.income + cur.expense;
      const inRatio = totalFlow > 0 ? Math.round((cur.income / totalFlow) * 100) : 50;
      const exRatio = 100 - inRatio;

      let miniReportText = "Belum ada pengeluaran tercatat di bulan ini. Yuk catat transaksi harian keluarga secara rutin!";
      if (cur.topExSub.length > 0) {
        const top1 = cur.topExSub[0];

    function setDashTab(group, val) {
      if (group === "ex") state.dashExTab = val;
      if (group === "in") state.dashInTab = val;
      if (group === "budget") state.dashBudgetTab = val;
      renderCurrentPage();
    }

    function initDashboardCharts(cur, prev, last6, rKeb, rKei, rInv, pKeb, pKei, pInv) {
      if (typeof Chart === "undefined") return;

      const dailyCtx = document.getElementById("chart-daily-expense");
      if (dailyCtx) {
        chartInstances.daily = new Chart(dailyCtx, {
          type: "line",
          data: {
            labels: cur.dailyExpense.map((_, i) => String(i + 1)),
            datasets: [{
              label: "Pengeluaran",
              data: cur.dailyExpense,
              borderColor: "#0f766e",
              backgroundColor: "rgba(15, 118, 110, 0.12)",
              borderWidth: 2,
              pointRadius: 2.5,
              pointBackgroundColor: "#0f766e",
              fill: true,
              tension: 0.35
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 250 },
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { font: { size: 9 } } },
              y: { beginAtZero: true, ticks: { font: { size: 9 }, callback: (v) => formatShortRp(v) } }
            }
          }
        });
      }

      const exDonutCtx = document.getElementById("chart-ex-donut");
      if (exDonutCtx && cur.topExMain.length > 0) {
        const palette = ["#e11d48", "#f97316", "#eab308", "#0d9488", "#0284c7", "#6366f1", "#a855f7", "#ec4899", "#64748b", "#14b8a6"];
        chartInstances.exDonut = new Chart(exDonutCtx, {
          type: "doughnut",
          data: {
            labels: cur.topExMain.map((x) => x.name),
            datasets: [{ data: cur.topExMain.map((x) => x.total), backgroundColor: palette, borderWidth: 2, borderColor: "#ffffff" }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 250 },
            cutout: "60%",
            plugins: { legend: { position: "right", labels: { boxWidth: 10, font: { size: 9 } } } }
          }
        });
      }

      const inDonutCtx = document.getElementById("chart-in-donut");
      if (inDonutCtx && cur.topInMain.length > 0) {
        chartInstances.inDonut = new Chart(inDonutCtx, {
          type: "doughnut",
          data: {
            labels: cur.topInMain.map((x) => x.name),
            datasets: [{ data: cur.topInMain.map((x) => x.total), backgroundColor: ["#0f766e", "#10b981", "#0284c7", "#8b5cf6"], borderWidth: 2, borderColor: "#ffffff" }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 250 },
            cutout: "62%",
            plugins: { legend: { position: "right", labels: { boxWidth: 10, font: { size: 9 } } } }
          }
        });
      }

      const inCompCtx = document.getElementById("chart-in-compare");
      if (inCompCtx) {
        const allInMain = Array.from(new Set(cur.topInMain.map((x) => x.name).concat(prev.topInMain.map((x) => x.name))));
        const getVal = (arr, name) => {
          const found = arr.find((x) => x.name === name);
          return found ? found.total : 0;
        };
        chartInstances.inComp = new Chart(inCompCtx, {
          type: "bar",
          data: {
            labels: allInMain.map((s) => s.length > 14 ? s.slice(0, 14) + ".." : s),
            datasets: [
              { label: "Bulan Ini", data: allInMain.map((n) => getVal(cur.topInMain, n)), backgroundColor: "#0f766e", borderRadius: 6 },
              { label: "Bulan Lalu", data: allInMain.map((n) => getVal(prev.topInMain, n)), backgroundColor: "#94a3b8", borderRadius: 6 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 250 },
            plugins: { legend: { labels: { boxWidth: 10, font: { size: 10 } } } },
            scales: {
              x: { grid: { display: false }, ticks: { font: { size: 9 } } },
              y: { beginAtZero: true, ticks: { font: { size: 9 }, callback: (v) => formatShortRp(v) } }
            }
          }
        });
      }

      const makeRing = (canvasId, key, val, target, color, bg) => {
        const ctx = document.getElementById(canvasId);
        if (!ctx) return;
        const filled = Math.min(val, target);
        const rem = Math.max(0, target - filled);
        chartInstances[key] = new Chart(ctx, {
          type: "doughnut",
          data: {
            datasets: [{ data: [filled, rem > 0 ? rem : (filled === 0 ? 1 : 0)], backgroundColor: [color, bg], borderWidth: 0 }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 250 },
            cutout: "72%",
            plugins: { legend: { display: false }, tooltip: { enabled: false } }
          }
        });
      };
      makeRing("chart-ring-keb", "ringKeb", rKeb, pKeb, "#e11d48", "#ffe4e6");
      makeRing("chart-ring-kei", "ringKei", rKei, pKei, "#f59e0b", "#fef3c7");
      makeRing("chart-ring-inv", "ringInv", rInv, pInv, "#0d9488", "#ccfbf1");

      const last6Ctx = document.getElementById("chart-last6");
      if (last6Ctx) {
        const rev = last6.slice().reverse();
        chartInstances.last6 = new Chart(last6Ctx, {
          type: "bar",
          data: {
            labels: rev.map((x) => x.label.split(" ")[0]),
            datasets: [
              { label: "Masuk", data: rev.map((x) => x.income), backgroundColor: "#0f766e", borderRadius: 4 },
              { label: "Keluar", data: rev.map((x) => x.expense), backgroundColor: "#e11d48", borderRadius: 4 },
              { label: "Saldo", data: rev.map((x) => x.saldo), backgroundColor: "#7e22ce", borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 250 },
            plugins: { legend: { labels: { boxWidth: 9, font: { size: 9 } } } },
            scales: {
              x: { grid: { display: false }, ticks: { font: { size: 9 } } },
              y: { ticks: { font: { size: 9 }, callback: (v) => formatShortRp(v) } }
            }
          }
        });
      }
    }

    // =========================================================================

    // =========================================================================
    function renderTransaksiPage(container) {
      const monthTx = getTransactionsByPeriod(state.selectedYear, state.selectedMonth);
      const q = state.txSearch.toLowerCase();
      const filtered = monthTx.filter((tx) => {
        if (state.txJenis !== "ALL" && tx.jenis !== state.txJenis) return false;
        if (state.txDompet !== "ALL" && tx.id_dompet !== state.txDompet && tx.id_dompet_tujuan !== state.txDompet) return false;
        if (q) {
          const hay = (tx.sub_kategori + " " + tx.kategori_utama + " " + (tx.catatan || "") + " " + getWalletName(tx.id_dompet)).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)));

      const listHtml = filtered.map((tx) => {
        const isIn = tx.jenis === "Pemasukan";
        const isTr = tx.jenis === "Transfer";
        const iconBg = isIn ? "bg-teal-100 text-teal-700" : (isTr ? "bg-sky-100 text-sky-700" : "bg-rose-100 text-rose-600");
        const iconFa = isIn ? "fa-arrow-down" : (isTr ? "fa-right-left" : "fa-arrow-up");
        const nomClass = isIn ? "text-teal-700" : (isTr ? "text-sky-700" : "text-rose-600");
        const sign = isIn ? "+" : (isTr ? "" : "-");
        const walletInfo = isTr
          ? getWalletName(tx.id_dompet) + " → " + getWalletName(tx.id_dompet_tujuan)
          : getWalletName(tx.id_dompet);

        return '<div class="glass-card rounded-2xl p-3 flex items-start gap-3">' +
          '<div class="w-10 h-10 rounded-xl ' + iconBg + ' flex items-center justify-center shrink-0 mt-0.5">' +
            '<i class="fa-solid ' + iconFa + ' text-sm"></i>' +
          '</div>' +
          '<div class="flex-1 min-w-0">' +
            '<div class="flex items-start justify-between gap-2">' +
              '<p class="text-xs font-extrabold text-slate-900 truncate">' + escapeHtml(tx.sub_kategori) + '</p>' +
              '<p class="text-xs font-extrabold ' + nomClass + ' whitespace-nowrap">' + sign + formatRp(tx.nominal) + '</p>' +
            '</div>' +
            '<div class="flex items-center flex-wrap gap-1.5 mt-0.5">' +
              '<span class="text-[10px] font-semibold text-slate-500">' + escapeHtml(tx.kategori_utama) + '</span>' +
              (tx.jenis === "Pengeluaran" ? '<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded-md border ' + getPosBadgeClass(tx.pos_budget) + '">' + escapeHtml(tx.pos_budget) + '</span>' : '') +
            '</div>' +
            (tx.catatan ? '<p class="text-[11px] text-slate-500 mt-1 line-clamp-1">' + escapeHtml(tx.catatan) + '</p>' : '') +
            '<div class="flex items-center justify-between mt-2 pt-1.5 border-t border-slate-100/90">' +
              '<span class="text-[10px] font-semibold text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>' + formatDateIndo(tx.tanggal) + ' &bull; ' + escapeHtml(walletInfo) + '</span>' +
              '<div class="flex items-center gap-1.5">' +
                '<button onclick="openTransaksiSheet(\'' + tx.id + '\')" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 hover:text-teal-700 flex items-center justify-center active:scale-95 transition"><i class="fa-solid fa-pen text-[10px]"></i></button>' +
                '<button onclick="confirmDeleteTx(\'' + tx.id + '\')" class="w-7 h-7 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center active:scale-95 transition"><i class="fa-solid fa-trash text-[10px]"></i></button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join("");

      container.innerHTML =
        '<div class="space-y-3">' +
          '<div class="flex items-center justify-between">' +
            '<div><h2 class="text-base font-extrabold text-slate-900">Riwayat Transaksi</h2><p class="text-[11px] text-slate-500">' + filtered.length + ' transaksi ditampilkan</p></div>' +
            '<button onclick="openTransaksiSheet()" class="px-3.5 py-2 rounded-xl bg-teal-700 text-white text-xs font-extrabold shadow-sm active:scale-95 transition"><i class="fa-solid fa-plus mr-1"></i>Catat</button>' +
          '</div>' +

          '<div class="glass-card rounded-2xl p-3 space-y-2">' +
            '<div class="relative">' +
              '<i class="fa-solid fa-magnifying-glass text-slate-400 text-xs absolute left-3 top-1/2 -translate-y-1/2"></i>' +
              '<input type="text" value="' + escapeHtml(state.txSearch) + '" oninput="onTxSearch(this.value)" placeholder="Cari sub kategori, catatan, dompet..." class="w-full min-h-[38px] pl-8 pr-3 rounded-xl bg-slate-100/90 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-teal-500" />' +
            '</div>' +
            '<div class="grid grid-cols-2 gap-2">' +
              '<select onchange="onTxJenisFilter(this.value)" class="min-h-[36px] px-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 bg-white">' +
                '<option value="ALL"' + (state.txJenis === "ALL" ? " selected" : "") + '>Semua Jenis</option>' +
                '<option value="Pengeluaran"' + (state.txJenis === "Pengeluaran" ? " selected" : "") + '>Pengeluaran</option>' +
                '<option value="Pemasukan"' + (state.txJenis === "Pemasukan" ? " selected" : "") + '>Pemasukan</option>' +
                '<option value="Transfer"' + (state.txJenis === "Transfer" ? " selected" : "") + '>Transfer</option>' +
              '</select>' +

                '<option value="ALL">Semua Dompet</option>' +
                state.data.dompet.map((w) =>
                  '<option value="' + w.id + '"' + (state.txDompet === w.id ? " selected" : "") + '>' + escapeHtml(w.nama_dompet) + '</option>'

          '</div>' +

          '</div>' +
        '</div>';
    }

    function onTxSearch(val) { state.txSearch = val; renderCurrentPage(); }
    function onTxJenisFilter(val) { state.txJenis = val; renderCurrentPage(); }
    function onTxDompetFilter(val) { state.txDompet = val; renderCurrentPage(); }

    function openTransaksiSheet(editId) {
      if (state.data.dompet.length === 0) {
        showToast("Tambahkan minimal 1 Dompet terlebih dahulu di menu Lainnya -> Dompet", "warning");
        return;
      }
      const tx = editId ? state.data.transaksi.find((x) => x.id === editId) : null;
      const jenis = tx ? tx.jenis : "Pengeluaran";
      const maxDay = new Date(state.selectedYear, state.selectedMonth + 1, 0).getDate();
      const defaultDate = tx ? String(tx.tanggal).slice(0, 10) : (state.selectedYear + "-" + pad2(state.selectedMonth + 1) + "-" + pad2(Math.min(nowDate.getDate(), maxDay)));

      const walletOpts = (selId) => state.data.dompet.map((w) =>
        '<option value="' + w.id + '"' + (w.id === selId ? " selected" : "") + '>' + escapeHtml(w.nama_dompet) + '</option>'
      ).join("");

      openSheet(tx ? "Edit Transaksi" : "Catat Transaksi Baru",
        '<form id="form-transaksi" onsubmit="submitTransaksi(event, \'' + (editId || "") + '\')" class="space-y-3.5">' +
          '<div class="grid grid-cols-3 gap-1.5 bg-slate-100 p-1 rounded-xl">' +
            ["Pengeluaran", "Pemasukan", "Transfer"].map((j) =>

                '<input type="radio" name="jenis" value="' + j + '"' + (jenis === j ? " checked" : "") + ' onchange="onTxJenisChange()" class="peer hidden" />' +
                '<div class="py-2 text-center rounded-lg text-[11px] font-extrabold text-slate-600 peer-checked:bg-white peer-checked:text-teal-700 peer-checked:shadow-xs transition">' + j + '</div>' +
              '</label>'
            ).join("") +
          '</div>' +

            '<div>' +
              '<label class="block text-[11px] font-bold text-slate-600 mb-1">Tanggal</label>' +
              '<input type="date" id="tx-tanggal" required value="' + defaultDate + '" class="w-full min-h-[42px] px-3 rounded-xl border border-slate-200 text-xs font-semibold" />' +
            '</div>' +
            '<div>' +
              '<label class="block text-[11px] font-bold text-slate-600 mb-1">Nominal (Rp)</label>' +
              '<input type="text" inputmode="numeric" id="tx-nominal" required oninput="formatNominalInput(this)" value="' + (tx ? formatNumberComma(tx.nominal) : "") + '" placeholder="150,000" class="w-full min-h-[42px] px-3 rounded-xl border border-slate-200 text-sm font-extrabold" />' +
            '</div>' +
          '</div>' +

          '<div id="tx-kat-wrapper" class="space-y-2.5">' +
            '<div>' +
              '<label class="block text-[11px] font-bold text-slate-600 mb-1">Kategori Utama</label>' +
              '<select id="tx-kat-utama" onchange="onTxMainCatChange()" class="w-full min-h-[42px] px-3 rounded-xl border border-slate-200 text-xs font-bold bg-white"></select>' +

            '<div>' +

              '<select id="tx-sub-kat" onchange="onTxSubCatChange()" class="w-full min-h-[42px] px-3 rounded-xl border border-slate-200 text-xs font-bold bg-white"></select>' +
            '</div>' +
            '<div id="tx-pos-wrapper" class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">' +

              '<div class="flex items-center gap-2">' +
                '<span id="tx-pos-badge" class="text-[10px] font-extrabold px-2 py-0.5 rounded-md border">Kebutuhan</span>' +

              '<label id="tx-dompet-label" class="block text-[11px] font-bold text-slate-600 mb-1">Dompet / Rekening</label>' +

    function onTxJenisChange(txPreset) {
      const checked = document.querySelector('#form-transaksi input[name="jenis"]:checked');
      if (!checked) return;
      const jenis = checked.value;
      const katWrap = document.getElementById("tx-kat-wrapper");
      const posWrap = document.getElementById("tx-pos-wrapper");
      const dstWrap = document.getElementById("tx-dompet-tujuan-wrap");
      const srcLabel = document.getElementById("tx-dompet-label");

      if (jenis === "Transfer") {
        katWrap.classList.add("hidden");
        dstWrap.classList.remove("hidden");
        srcLabel.textContent = "Dompet Asal";
        return;
      }

      katWrap.classList.remove("hidden");
      dstWrap.classList.add("hidden");
      srcLabel.textContent = "Dompet / Rekening";
      posWrap.classList.toggle("hidden", jenis !== "Pengeluaran");

      const listKat = state.data.kategori.filter((k) => k.jenis === jenis);
      const uniqueMain = Array.from(new Set(listKat.map((k) => k.kategori_utama)));
      const mainSel = document.getElementById("tx-kat-utama");
      mainSel.innerHTML = uniqueMain.map((m) => '<option value="' + escapeHtml(m) + '">' + escapeHtml(m) + '</option>').join("");

      if (txPreset && txPreset.kategori_utama && uniqueMain.includes(txPreset.kategori_utama)) {
        mainSel.value = txPreset.kategori_utama;
      }
      onTxMainCatChange(txPreset);
    }

    function onTxMainCatChange(txPreset) {
      const checked = document.querySelector('#form-transaksi input[name="jenis"]:checked');
      if (!checked || checked.value === "Transfer") return;
      const jenis = checked.value;
      const mainCat = document.getElementById("tx-kat-utama").value;
      const subs = state.data.kategori.filter((k) => k.jenis === jenis && k.kategori_utama === mainCat);
      const subSel = document.getElementById("tx-sub-kat");
      subSel.innerHTML = subs.map((s) => '<option value="' + escapeHtml(s.sub_kategori) + '">' + escapeHtml(s.sub_kategori) + '</option>').join("");

      if (txPreset && txPreset.sub_kategori) {
        subSel.value = txPreset.sub_kategori;
      }
      onTxSubCatChange(txPreset);
    }

    function onTxSubCatChange(txPreset) {
      const checked = document.querySelector('#form-transaksi input[name="jenis"]:checked');
      if (!checked || checked.value !== "Pengeluaran") return;
      const mainCat = document.getElementById("tx-kat-utama").value;
      const subCat = document.getElementById("tx-sub-kat").value;
      const found = state.data.kategori.find((k) => k.jenis === "Pengeluaran" && k.kategori_utama === mainCat && k.sub_kategori === subCat);
      const posSel = document.getElementById("tx-pos-budget");
      if (txPreset && txPreset.pos_budget && txPreset.pos_budget !== "-") {
        posSel.value = txPreset.pos_budget;
      } else if (found && found.pos_budget && found.pos_budget !== "-") {
        posSel.value = found.pos_budget;
      }
      updatePosBadgePreview();
    }

    function updatePosBadgePreview() {
      const posSel = document.getElementById("tx-pos-budget");
      const badge = document.getElementById("tx-pos-badge");
      if (!posSel || !badge) return;
      badge.textContent = posSel.value;
      badge.className = "text-[10px] font-extrabold px-2 py-0.5 rounded-md border " + getPosBadgeClass(posSel.value);
    }

    async function submitTransaksi(e, editId) {
      e.preventDefault();
      const jenis = document.querySelector('#form-transaksi input[name="jenis"]:checked').value;
      const dompetAsal = document.getElementById("tx-dompet").value;
      const dompetTujuan = jenis === "Transfer" ? document.getElementById("tx-dompet-tujuan").value : null;
      const nominalVal = parseNominal(document.getElementById("tx-nominal").value);

      if (nominalVal <= 0) {
        showToast("Nominal harus lebih dari 0", "warning");
        return;
      }
      if (jenis === "Transfer" && dompetAsal === dompetTujuan) {
        showToast("Dompet asal dan tujuan tidak boleh sama", "warning");
        return;
      }

      const id = editId || genId("TX");
      const existing = editId ? state.data.transaksi.find((x) => x.id === editId) : null;
      const record = {
        id,
        tanggal: document.getElementById("tx-tanggal").value,
        jenis,
        kategori_utama: jenis === "Transfer" ? "Transfer" : (document.getElementById("tx-kat-utama").value || "Lain-lain"),
        sub_kategori: jenis === "Transfer" ? "Pindah Saldo" : (document.getElementById("tx-sub-kat").value || "Umum"),
        pos_budget: jenis === "Pengeluaran" ? document.getElementById("tx-pos-budget").value : "-",
        id_dompet: dompetAsal,
        id_dompet_tujuan: dompetTujuan || null,
        nominal: nominalVal,
        catatan: document.getElementById("tx-catatan").value.trim(),
        dicatat_oleh: "Keluarga Abu Syauqi",
        created_at: existing ? existing.created_at : new Date().toISOString()
      };

      closeSheet();
      await runOptimisticMutation(
        () => {
          if (editId) {
            const idx = state.data.transaksi.findIndex((x) => x.id === editId);
            if (idx >= 0) state.data.transaksi[idx] = record;
          } else {
            state.data.transaksi.unshift(record);
          }
        },
        () => editId
          ? supabase.from("transaksi").update(record).eq("id", editId)
          : supabase.from("transaksi").insert(record),
        editId ? "Transaksi diperbarui" : "Transaksi dicatat"
      );
    }

    function confirmDeleteTx(id) {
      showConfirm("Hapus Transaksi", "Data transaksi yang dihapus tidak dapat dikembalikan. Lanjutkan?", async () => {
        await runOptimisticMutation(
          () => { state.data.transaksi = state.data.transaksi.filter((x) => x.id !== id); },
          () => supabase.from("transaksi").delete().eq("id", id),
          "Transaksi dihapus"
        );
      });
    }

    async function submitTargetForm(e, key, fromSheet) {
      e.preventDefault();
      const nom = parseNominal(document.getElementById("ang-target-nom").value);
      const pkeb = Number(document.getElementById("ang-pkeb").value) || 0;
      const pkei = Number(document.getElementById("ang-pkei").value) || 0;
      const pinv = Number(document.getElementById("ang-pinv").value) || 0;
      if (pkeb + pkei + pinv !== 100) {
        showToast("Total persentase Kebutuhan + Keinginan + Investasi harus 100%", "warning");
        return;
      }

      const record = {
        id: "TB-" + key,
        bulan_tahun: key,
        target_pengeluaran: nom,
        persen_kebutuhan: pkeb,
        persen_keinginan: pkei,
        persen_investasi: pinv
      };

      if (fromSheet) closeSheet();
      await runOptimisticMutation(
        () => {
          const idx = state.data.targetBulanan.findIndex((x) => x.bulan_tahun === key);
          if (idx >= 0) state.data.targetBulanan[idx] = record;
          else state.data.targetBulanan.push(record);
        },
        () => supabase.from("target_bulanan").upsert(record, { onConflict: "bulan_tahun" }),
        "Target anggaran disimpan"
      );
    }

    async function submitSetorTabungan(e, id) {
      e.preventDefault();
      const addNom = parseNominal(document.getElementById("gl-setor-nom").value);
      if (addNom <= 0) {
        showToast("Nominal setoran harus lebih dari 0", "warning");
        return;
      }
      const g = state.data.targetTabungan.find((x) => x.id === id);
      if (!g) return;

      const newTerkumpul = (Number(g.terkumpul) || 0) + addNom;
      const newStatus = newTerkumpul >= Number(g.target_nominal) ? "Tercapai" : "Berjalan";
      const catatTx = document.getElementById("gl-catat-tx").checked;
      const dmpEl = document.getElementById("gl-setor-dmp");
      const idDompet = dmpEl ? dmpEl.value : null;

      let txRecord = null;
      if (catatTx && idDompet) {
        txRecord = {
          id: genId("TX"),
          tanggal: new Date().toISOString().slice(0, 10),
          jenis: "Pengeluaran",
          kategori_utama: "Investasi & Tabungan",
          sub_kategori: "Tabungan rutin",
          pos_budget: "Investasi",
          id_dompet: idDompet,
          id_dompet_tujuan: null,
          nominal: addNom,
          catatan: "Setor Target: " + g.nama_target,
          dicatat_oleh: "Keluarga Abu Syauqi",
          created_at: new Date().toISOString()
        };
      }

      closeSheet();
      await runOptimisticMutation(
        () => {
          const targetObj = state.data.targetTabungan.find((x) => x.id === id);
          if (targetObj) {
            targetObj.terkumpul = newTerkumpul;
            targetObj.status = newStatus;
          }
          if (txRecord) state.data.transaksi.unshift(txRecord);
        },
        async () => {
          const res1 = await supabase.from("target_tabungan").update({ terkumpul: newTerkumpul, status: newStatus }).eq("id", id);
          if (res1.error) return res1;
          if (txRecord) return await supabase.from("transaksi").insert(txRecord);
          return res1;
        },
        "Setoran berhasil diproses"
      );
    }

    function exportMonthlyCSV() {
      const list = getTransactionsByPeriod(state.selectedYear, state.selectedMonth);
      if (list.length === 0) {
        showToast("Tidak ada transaksi untuk diekspor", "warning");
        return;
      }
      const header = ["Tanggal", "Jenis", "Kategori Utama", "Sub Kategori", "Pos Budget", "Dompet", "Nominal", "Catatan"];
      const rows = list.map((tx) =>
        [
          tx.tanggal, tx.jenis, tx.kategori_utama, tx.sub_kategori,
          tx.pos_budget, getWalletName(tx.id_dompet), tx.nominal, tx.catatan || ""
        ].map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(",")
      );
      const csv = "\uFEFF" + header.join(",") + "\n" + rows.join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Abu_Syauqi_Budgeting_" + getBulanTahunKey(state.selectedYear, state.selectedMonth) + ".csv";
      a.click();
      URL.revokeObjectURL(url);
      showToast("File CSV berhasil diunduh", "success");
    }

          '<div class="grid grid-cols-2 gap-1.5 bg-slate-200/70 p-1 rounded-xl">' +
            '<button onclick="setKatTab(\'Pengeluaran\')" class="py-2 rounded-lg text-xs font-extrabold transition ' + (state.katTab === "Pengeluaran" ? 'bg-white text-rose-600 shadow-xs' : 'text-slate-600') + '">Pengeluaran (' + exCount + ')</button>' +
            '<button onclick="setKatTab(\'Pemasukan\')" class="py-2 rounded-lg text-xs font-extrabold transition ' + (state.katTab === "Pemasukan" ? 'bg-white text-teal-700 shadow-xs' : 'text-slate-600') + '">Pemasukan (' + inCount + ')</button>' +
          '</div>' +
          '<input type="text" value="' + escapeHtml(state.katSearch) + '" oninput="onKatSearch(this.value)" placeholder="Cari kategori atau sub kategori..." class="w-full min-h-[40px] px-3.5 rounded-xl bg-white/90 border border-slate-200 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-teal-500" />' +
          '<div class="space-y-2.5">' + (groupsHtml || '<p class="text-xs text-slate-400 text-center py-6">Kategori tidak ditemukan</p>') + '</div>' +
        '</div>';
    }

    function setKatTab(val) { state.katTab = val; renderCurrentPage(); }
    function onKatSearch(val) { state.katSearch = val; renderCurrentPage(); }
    function toggleKatGroup(name) { state.katCollapsed[name] = !state.katCollapsed[name]; renderCurrentPage(); }

    function openKategoriSheet() {
      const mainSuggestions = Array.from(new Set(state.data.kategori.map((k) => k.kategori_utama)));
      openSheet("Tambah Sub Kategori",
        '<form onsubmit="submitKategori(event)" class="space-y-3">' +
          '<div><label class="block text-[11px] font-bold text-slate-600 mb-1">Jenis</label><select id="kat-jenis" onchange="document.getElementById(\'kat-pos-row\').classList.toggle(\'hidden\', this.value!==\'Pengeluaran\')" class="w-full min-h-[42px] px-3 rounded-xl border border-slate-200 text-xs font-bold bg-white"><option value="Pengeluaran">Pengeluaran</option><option value="Pemasukan">Pemasukan</option></select></div>' +
          '<div><label class="block text-[11px] font-bold text-slate-600 mb-1">Kategori Utama</label><input type="text" id="kat-main" list="main-cat-suggestions" required placeholder="Contoh: Kebutuhan Rumah Tangga" class="w-full min-h-[42px] px-3 rounded-xl border border-slate-200 text-xs font-bold" /><datalist id="main-cat-suggestions">' +
            mainSuggestions.map((m) => '<option value="' + escapeHtml(m) + '"></option>').join("") +
          '</datalist></div>' +
          '<div><label class="block text-[11px] font-bold text-slate-600 mb-1">Sub Kategori</label><input type="text" id="kat-sub" required placeholder="Contoh: Service AC" class="w-full min-h-[42px] px-3 rounded-xl border border-slate-200 text-xs font-bold" /></div>' +
          '<div id="kat-pos-row"><label class="block text-[11px] font-bold text-slate-600 mb-1">Pos Budgeting 50/30/20</label><select id="kat-pos" class="w-full min-h-[42px] px-3 rounded-xl border border-slate-200 text-xs font-bold bg-white"><option value="Kebutuhan">Kebutuhan (50%)</option><option value="Keinginan">Keinginan (30%)</option><option value="Investasi">Investasi (20%)</option></select></div>' +
          '<button type="submit" class="w-full min-h-[46px] rounded-xl bg-teal-700 text-white text-sm font-extrabold">Simpan Kategori</button>' +
        '</form>'
      );
    }

    async function submitKategori(e) {
      e.preventDefault();
      const jenis = document.getElementById("kat-jenis").value;
      const record = {
        id: genId("KAT"),
        jenis,
        kategori_utama: document.getElementById("kat-main").value.trim(),
        sub_kategori: document.getElementById("kat-sub").value.trim(),
        pos_budget: jenis === "Pengeluaran" ? document.getElementById("kat-pos").value : "-"
      };
      closeSheet();
      await runOptimisticMutation(
        () => { state.data.kategori.push(record); },
        () => supabase.from("kategori").insert(record),
        "Kategori ditambahkan"
      );
    }

    function confirmDeleteKat(id) {
      showConfirm("Hapus Kategori", "Yakin ingin menghapus sub kategori ini?", async () => {
        await runOptimisticMutation(
          () => { state.data.kategori = state.data.kategori.filter((x) => x.id !== id); },
          () => supabase.from("kategori").delete().eq("id", id),
          "Kategori dihapus"
        );
      });
    }

    // =========================================================================
    // 12. FITUR PWA AUTO-INSTALL (MANIFEST, SERVICE WORKER & PANDUAN HP)
    // =========================================================================
    let deferredInstallPrompt = null;

    function isRunningStandalone() {
      return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
    }

    function isIosDevice() {
      return /iphone|ipad|ipod/i.test(window.navigator.userAgent || "");
    }

    function initPwaManifest() {
      if (!IS_PREVIEW) return; // Produksi Vercel memakai file statis ./manifest.json
      try {
        const manifest = {
          name: "Abu Syauqi Budgeting",
          short_name: "Abu Syauqi",
          description: "Aplikasi pencatatan keuangan & budgeting 50/30/20 keluarga modern",
          start_url: window.location.origin + window.location.pathname,
          display: "standalone",
          orientation: "portrait",
          background_color: "#f8fafc",
          theme_color: "#0f766e",
          icons: [
            { src: "https://placehold.co/192x192/0f766e/ffffff.png?text=AS", sizes: "192x192", type: "image/png", purpose: "any maskable" },
            { src: "https://placehold.co/512x512/0f766e/ffffff.png?text=AS", sizes: "512x512", type: "image/png", purpose: "any maskable" }
          ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
        const linkEl = document.getElementById("pwa-manifest-link");
        if (linkEl) linkEl.setAttribute("href", URL.createObjectURL(blob));
      } catch (e) {}
    }

    function registerPwaServiceWorker() {
      if (IS_PREVIEW) return;
      try {
        if ("serviceWorker" in navigator && (window.location.protocol === "https:" || window.location.hostname === "localhost")) {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        }
      } catch (e) {}
    }

    function showPwaInstallUI(showBanner) {
      if (isRunningStandalone()) return;
      const topBtn = document.getElementById("btn-install-top");
      const banner = document.getElementById("pwa-install-banner");
      if (topBtn) {
        topBtn.classList.remove("hidden");
        topBtn.classList.add("flex");
      }
      if (banner && showBanner && !sessionStorage.getItem(PWA_DISMISS_KEY)) {
        banner.classList.remove("hidden");
      }
    }

    function hidePwaInstallUI() {
      const topBtn = document.getElementById("btn-install-top");
      const banner = document.getElementById("pwa-install-banner");
      if (topBtn) {
        topBtn.classList.add("hidden");
        topBtn.classList.remove("flex");
      }
      if (banner) banner.classList.add("hidden");
    }

    function dismissPwaBanner() {
      const banner = document.getElementById("pwa-install-banner");
      if (banner) banner.classList.add("hidden");
      try { sessionStorage.setItem(PWA_DISMISS_KEY, "1"); } catch (e) {}
    }

    async function triggerPwaInstall() {
      if (isRunningStandalone()) {
        showToast("Aplikasi sudah terpasang di HP Anda", "info");
        return;
      }
      if (deferredInstallPrompt) {
        try {
          deferredInstallPrompt.prompt();
          const choice = await deferredInstallPrompt.userChoice;
          if (choice && choice.outcome === "accepted") {
            showToast("Memasang aplikasi ke HP...", "success");
            hidePwaInstallUI();
          }
          deferredInstallPrompt = null;
          return;
        } catch (err) {}
      }

      if (isIosDevice()) {
        openSheet("Pasang di Layar Utama iPhone",
          '<div class="space-y-3.5 text-xs text-slate-700">' +
            '<p class="leading-relaxed">Ikuti 3 langkah singkat di Safari iPhone:</p>' +
            '<div class="space-y-2.5">' +
              '<div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200"><span class="w-7 h-7 rounded-lg bg-teal-700 text-white font-extrabold flex items-center justify-center shrink-0">1</span><p>Ketuk ikon <b>Share</b> (<i class="fa-solid fa-arrow-up-from-bracket text-teal-700"></i>) di bawah Safari.</p></div>' +
              '<div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200"><span class="w-7 h-7 rounded-lg bg-teal-700 text-white font-extrabold flex items-center justify-center shrink-0">2</span><p>Pilih <b>Add to Home Screen</b> (Tambahkan ke Layar Utama).</p></div>' +
              '<div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200"><span class="w-7 h-7 rounded-lg bg-teal-700 text-white font-extrabold flex items-center justify-center shrink-0">3</span><p>Ketuk <b>Add / Tambah</b> di pojok kanan atas.</p></div>' +
            '</div>' +
            '<button onclick="closeSheet()" class="w-full min-h-[44px] rounded-xl bg-teal-700 text-white font-extrabold">Mengerti</button>' +
          '</div>'
        );
        return;
      }

      openSheet("Cara Install ke HP (Android)",
        '<div class="space-y-3.5 text-xs text-slate-700">' +
          '<p class="leading-relaxed">Popup install otomatis aktif saat dibuka melalui URL <b>HTTPS Vercel</b> di Chrome HP, atau pasang manual:</p>' +
          '<div class="space-y-2.5">' +
            '<div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200"><span class="w-7 h-7 rounded-lg bg-teal-700 text-white font-extrabold flex items-center justify-center shrink-0">1</span><p>Buka link aplikasi Vercel Anda di <b>Google Chrome</b>.</p></div>' +
            '<div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200"><span class="w-7 h-7 rounded-lg bg-teal-700 text-white font-extrabold flex items-center justify-center shrink-0">2</span><p>Ketuk ikon titik tiga (<b>⋮</b>) di pojok kanan atas.</p></div>' +
            '<div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200"><span class="w-7 h-7 rounded-lg bg-teal-700 text-white font-extrabold flex items-center justify-center shrink-0">3</span><p>Pilih <b>Install app</b> atau <b>Tambahkan ke layar utama</b>.</p></div>' +
          '</div>' +
          '<button onclick="closeSheet()" class="w-full min-h-[44px] rounded-xl bg-teal-700 text-white font-extrabold">Tutup</button>' +
        '</div>'
      );
    }

    function initPwaInstaller() {
      initPwaManifest();
      registerPwaServiceWorker();
      if (isRunningStandalone()) {
        hidePwaInstallUI();
        return;
      }
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        showPwaInstallUI(true);
      });
      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        hidePwaInstallUI();
        showToast("Aplikasi berhasil dipasang di HP Anda!", "success");
      });
      setTimeout(() => {
        if (!isRunningStandalone()) {
          showPwaInstallUI(isIosDevice() || Boolean(deferredInstallPrompt));
        }
      }, 1200);
    }

    // =========================================================================
    // 13. EKSPOS HANDLER KE GLOBAL WINDOW (UNTUK ONCLICK HTML DI ESM MODULE)
    // =========================================================================
    Object.assign(window, {
      state,
      manualRefresh,
      shiftPeriod,
      onGlobalPeriodChange,
      navigateTo,
      setDashTab,
      openSheet,
      closeSheet,
      formatNominalInput,
      onTxSearch,
      onTxJenisFilter,
      onTxDompetFilter,
      openTransaksiSheet,
      onTxJenisChange,
      onTxMainCatChange,
      onTxSubCatChange,
      updatePosBadgePreview,
      submitTransaksi,
      confirmDeleteTx,
      openTargetSheet,
      submitTargetForm,
      openDompetSheet,
      submitDompet,
      confirmDeleteDompet,
      openTabunganSheet,
      submitTabungan,
      openSetorSheet,
      submitSetorTabungan,
      confirmDeleteGoal,
      openTagihanSheet,
      submitTagihan,
      toggleTagihanStatus,
      confirmDeleteBill,
      exportMonthlyCSV,
      setKatTab,
      onKatSearch,
      toggleKatGroup,
      openKategoriSheet,
      submitKategori,
      confirmDeleteKat,
      triggerPwaInstall,
      dismissPwaBanner
    });

    // =========================================================================
    // 14. BOOTSTRAP APLIKASI 0 DETIK (INSTANT HYDRATION)
    // =========================================================================
    function bootstrapApp() {
      initPwaInstaller();
      renderTopBar();
      renderBottomNav();

      if (IS_PREVIEW) {
        // Mode Preview: muat dari localStorage atau data dummy minimalis instan (0 ms)
        const cachedPreview = loadLocalCache();
        if (cachedPreview && Array.isArray(cachedPreview.kategori) && cachedPreview.kategori.length > 0) {
          applyDataToState(cachedPreview);
        } else {
          applyDataToState(buildMinimalPreviewData());
        }
        return;
      }

      // Mode Produksi Supabase (IS_PREVIEW = false):
      // 1. Hydrate instan 0 ms dari cache lokal jika ada, lalu langsung render UI
      const cachedLive = loadLocalCache();
      if (cachedLive) {
        applyDataToState(cachedLive);
      } else {
        // First-load tanpa cache: langsung tampilkan UI bersih tanpa blocking loader
        renderCurrentPage();
      }
      // 2. Sinkronisasi paralel 6 tabel Supabase di latar belakang
      syncFromSupabase(true);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootstrapApp);
    } else {
      bootstrapApp();
    }
  </script>
</body>
</html>
